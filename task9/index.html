<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>zen money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>zen money</h1>
            <button id="theme-toggle">dark mode</button>
        </div>

        <div class="summary" id="summary">
            <span>income: 0</span>
            <span>expense: 0</span>
            <span>balance: 0</span>
        </div>

        <!-- filters block -->
        <div class="filters">
            <h3>filters</h3>
            <div class="filter-row">
                <select id="filter-category">
                    <option value="">all categories</option>
                </select>
                <select id="filter-type">
                    <option value="all">all types</option>
                    <option value="income">income</option>
                    <option value="expense">expense</option>
                </select>
                <input type="date" id="filter-date-from" placeholder="from">
                <input type="date" id="filter-date-to" placeholder="to">
                <button id="reset-filters">reset</button>
            </div>
        </div>

        <!-- new category form -->
        <div class="new-category">
            <h3>new category</h3>
            <div class="filter-row">
                <input type="text" id="new-category-name" placeholder="category name">
                <select id="new-category-type">
                    <option value="expense">expense</option>
                    <option value="income">income</option>
                </select>
                <button id="add-category-btn">add category</button>
            </div>
        </div>

        <!-- transaction form -->
        <form id="transaction-form" novalidate>
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <input type="number" id="amount" placeholder="amount" step="0.01">
                <span class="error" id="amount-error"></span>
            </div>
            
            <div class="form-group">
                <select id="type">
                    <option value="income">income</option>
                    <option value="expense">expense</option>
                </select>
            </div>

            <div class="form-group">
                <select id="category">
                    <option value="">select category</option>
                </select>
                <span class="error" id="category-error"></span>
            </div>

            <div class="form-group">
                <input type="date" id="date">
                <span class="error" id="date-error"></span>
            </div>

            <div class="form-group">
                <input type="text" id="comment" placeholder="comment">
            </div>
            
            <button type="submit" id="submit-btn">add</button>
            <button type="button" id="cancel-btn" class="hidden">cancel</button>
        </form>

        <div id="transactions-list"></div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
